{% extends "base.html" %}
{% block title %}{{ title }} · SecureBank Pro{% endblock %}
{% block body_class %}page-error{% endblock %}
{% block content %}
<section class="error">
  <p class="error-code glitch" data-text="{{ code }}">{{ code }}</p>
  <h1>{{ title }}</h1>
  {% if detail %}<p class="muted">{{ detail }}</p>{% endif %}
  <a class="btn btn-brass" href="{{ url_for('bank.dashboard') if g.user else url_for('auth.landing') }}">{{ 'Back to overview' if g.user else 'Go to the home page' }}</a>
</section>
{% endblock %}
