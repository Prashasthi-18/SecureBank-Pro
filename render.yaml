# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: securebank-pro
    runtime: docker
    plan: free
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: BEHIND_PROXY
        value: "true"
      - key: SESSION_MINUTES
        value: "15"
      - key: IDLE_TIMEOUT_SECONDS
        value: "600"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
